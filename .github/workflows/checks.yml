name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Build, test and validate data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run data:validate
      - run: npm run audit:gender
      - run: git diff --exit-code -- docs/gender-audit.json
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    name: Scan secrets including Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched history and tracked files
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --max-archive-depth=3 --max-decode-depth=2
          mkdir "$RUNNER_TEMP/scan-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/scan-tree"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/scan-tree" --redact --max-archive-depth=3 --max-decode-depth=2
